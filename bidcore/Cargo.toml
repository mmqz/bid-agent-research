[workspace]
resolver = "2"
members = [
    "crates/bid-domain",
    "crates/bid-parse",
    "crates/bid-kb",
    "crates/bid-tools",
    "crates/bid-grade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
quick-xml = "0.36"
zip = "4"
calamine = "0.28"
unicode-normalization = "0.1"

[profile.release]
debug = false
