[package]
name = "m1"
version = "0.1.0"
edition = "2021"
description = "AI 标书系统研究验证 M1 最小流水线（权威状态机 + import/extract + 确定性切块 + exact 通道）"
publish = false

[dependencies]
zip = { version = "2.2", default-features = true }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
strip = true
